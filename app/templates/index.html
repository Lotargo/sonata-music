<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioSR Upscaler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); }
        .track-card:hover .play-overlay { opacity: 1; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            background: #6366f1;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen pb-32">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass border-b border-white/10 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i data-lucide="waves" class="text-indigo-500 w-8 h-8"></i>
            <span class="text-xl font-bold tracking-tight">AudioSR <span class="text-indigo-500">Upscaler</span></span>
        </div>
        <button id="upload-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-full font-medium transition flex items-center gap-2">
            <i data-lucide="upload" class="w-4 h-4"></i> Upload Track
        </button>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <!-- Upload Modal (Hidden) -->
        <div id="upload-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
            <div class="bg-[#1e293b] w-full max-w-lg rounded-2xl p-8 border border-white/10 shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Upload Audio</h2>
                    <button id="close-upload" class="text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
                </div>

                <div id="drop-zone" class="border-2 border-dashed border-slate-700 rounded-xl p-10 text-center hover:border-indigo-500 hover:bg-indigo-500/5 transition cursor-pointer mb-6">
                    <i data-lucide="music" class="w-12 h-12 text-slate-500 mx-auto mb-4"></i>
                    <p class="text-lg font-medium">Drag & drop or click to select</p>
                    <p class="text-slate-400 text-sm mt-1">MP3, WAV, FLAC, OGG (Max 50MB)</p>
                    <input type="file" id="file-input" class="hidden" accept="audio/*">
                </div>

                <div id="file-info" class="hidden mb-6 p-4 bg-slate-800/50 rounded-lg flex items-center justify-between">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <i data-lucide="file-audio" class="text-indigo-400 shrink-0"></i>
                        <span id="filename-display" class="truncate font-medium">track.mp3</span>
                    </div>
                    <button id="remove-file" class="text-red-400 hover:text-red-300"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>

                <div class="grid grid-cols-3 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Format</label>
                        <select id="target-format" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="wav">WAV</option>
                            <option value="mp3" selected>MP3</option>
                            <option value="flac">FLAC</option>
                            <option value="ogg">OGG</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">Sample Rate</label>
                        <select id="target-sr" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="44100">44.1 kHz</option>
                            <option value="48000" selected>48 kHz</option>
                            <option value="96000">96 kHz</option>
                        </select>
                    </div>
                    <div id="bitrate-container">
                        <label class="block text-sm font-medium text-slate-400 mb-2">Bitrate</label>
                        <select id="target-bitrate" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="128k">128 kbps</option>
                            <option value="192k">192 kbps</option>
                            <option value="256k">256 kbps</option>
                            <option value="320k" selected>320 kbps</option>
                            <option value="512k">512 kbps</option>
                            <option value="1024k">1024 kbps</option>
                            <option value="1411k">1411 kbps (CD)</option>
                            <option value="2304k">2304 kbps</option>
                            <option value="4608k">4608 kbps (Pro)</option>
                        </select>
                    </div>
                </div>

                <button id="start-upload" disabled class="w-full bg-indigo-600 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-indigo-700 text-white py-3 rounded-xl font-bold transition">
                    Process & Add to Library
                </button>
            </div>
        </div>

        <!-- Library Section -->
        <div class="mb-10">
            <h1 class="text-3xl font-extrabold mb-8 flex items-center gap-3">
                <i data-lucide="library" class="text-indigo-500"></i>
                Your Library
            </h1>
            <div id="library-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                <!-- Tracks will be loaded here -->
            </div>
            <div id="empty-state" class="hidden text-center py-20">
                <div class="bg-slate-800/30 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i data-lucide="music-4" class="w-10 h-10 text-slate-600"></i>
                </div>
                <h3 class="text-xl font-bold mb-2">No tracks yet</h3>
                <p class="text-slate-400">Upload your first track to start upscaling</p>
            </div>
        </div>
    </main>

    <!-- Player Bar -->
    <div id="player-bar" class="fixed bottom-0 left-0 right-0 glass border-t border-white/10 p-4 z-50 hidden">
        <div class="max-w-7xl mx-auto flex items-center gap-6">
            <!-- Track Info -->
            <div class="flex items-center gap-4 w-1/4">
                <img id="player-cover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&h=100&fit=crop" class="w-12 h-12 rounded-md object-cover shadow-lg">
                <div class="overflow-hidden">
                    <h4 id="player-title" class="font-bold truncate">No track playing</h4>
                    <p id="player-artist" class="text-xs text-slate-400 truncate">Unknown Artist</p>
                </div>
                <button id="toggle-favorite" class="text-slate-500 hover:text-red-500 transition ml-2">
                    <i data-lucide="heart" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Controls & Waveform -->
            <div class="flex-1">
                <div class="flex items-center justify-center gap-6 mb-2">
                    <button class="text-slate-400 hover:text-white"><i data-lucide="skip-back" class="w-5 h-5"></i></button>
                    <button id="play-pause" class="bg-white text-black w-10 h-10 rounded-full flex items-center justify-center hover:scale-105 transition shadow-lg">
                        <i data-lucide="play" class="fill-current w-5 h-5"></i>
                    </button>
                    <button class="text-slate-400 hover:text-white"><i data-lucide="skip-forward" class="w-5 h-5"></i></button>
                </div>
                <div id="waveform" class="w-full"></div>
                <div class="flex justify-between text-[10px] text-slate-500 mt-1 font-mono">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <!-- Volume & More -->
            <div class="flex items-center justify-end gap-4 w-1/4">
                <div class="flex items-center gap-2 group">
                    <i data-lucide="volume-2" class="w-5 h-5 text-slate-400"></i>
                    <input type="range" id="volume" min="0" max="1" step="0.05" value="0.7" class="w-24 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                </div>
                <button id="download-current" class="text-slate-400 hover:text-white transition p-2" title="Download">
                    <i data-lucide="download" class="w-5 h-5"></i>
                </button>
                <div id="status-badge" class="px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider bg-slate-800 text-slate-400">
                    Original
                </div>
            </div>
        </div>
    </div>

    <!-- Modals, Toast Container, etc. -->
    <div id="toast-container" class="fixed bottom-24 right-6 z-[100] space-y-3"></div>

    <script src="/static/js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
