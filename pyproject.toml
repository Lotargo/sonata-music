[project]
name = "app"
version = "0.1.0"
description = "Audio Upscaler Backend"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "audiosr>=0.0.7",
    "flask>=3.1.2",
    "flask-sqlalchemy>=3.1.1",
    "mutagen>=1.47.0",
    "pydub>=0.25.1",
    "scipy>=1.15.3",
    "setuptools>=80.10.2",
    "matplotlib>=3.8.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
]

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[tool.poetry.dependencies]
torch = { version = ">=2.10.0", source = "pytorch" }
torchaudio = { version = ">=2.10.0", source = "pytorch" }
