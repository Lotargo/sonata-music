[project]
name = "audio-upscaler"
version = "0.1.0"
description = "Audio upscaler for Suno tracks using AudioSR"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "audiosr>=0.0.7",
    "flask>=3.1.2",
    "librosa>=0.9.2",
    "python-dotenv>=1.2.1",
    "setuptools>=80.10.2",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.12.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audio_upscaler"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
