{% extends 'music/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto p-8">
    <h1 class="text-3xl font-bold mb-8">Upload New Track</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-6 bg-yandex-lightgray p-8 rounded-xl shadow-lg">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium mb-2">Title</label>
            <input type="text" name="title" class="w-full bg-[#333] border border-gray-600 rounded p-3 text-white focus:border-yandex-yellow focus:outline-none transition" placeholder="Track Title">
        </div>

        <div>
            <label class="block text-sm font-medium mb-2">Artist</label>
            <input type="text" name="artist" class="w-full bg-[#333] border border-gray-600 rounded p-3 text-white focus:border-yandex-yellow focus:outline-none transition" placeholder="Artist Name">
        </div>

        <div>
            <label class="block text-sm font-medium mb-2">Audio File</label>
            <input type="file" name="audio_file" accept="audio/*" class="w-full text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-yandex-yellow file:text-black hover:file:bg-yellow-400 transition cursor-pointer">
        </div>

        <div>
            <label class="block text-sm font-medium mb-2">Cover Art</label>
            <input type="file" name="cover_image" accept="image/*" class="w-full text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-gray-600 file:text-white hover:file:bg-gray-500 transition cursor-pointer">
        </div>

        <button type="submit" class="w-full bg-yandex-yellow text-black font-bold py-3 rounded-lg hover:bg-yellow-400 transition shadow-lg mt-4">
            Upload
        </button>
    </form>
</div>
{% endblock %}
