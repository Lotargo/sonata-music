{% extends 'music/base.html' %}

{% block content %}
<div class="p-8">
    <h1 class="text-4xl font-bold mb-8">Recently Played</h1>

    <div class="space-y-4">
        {% for track in tracks %}
        <div class="flex items-center gap-4 p-4 rounded-lg hover:bg-yandex-lightgray transition group">
            <!-- Cover -->
            <div class="w-12 h-12 bg-gray-700 rounded overflow-hidden flex-shrink-0 relative">
                {% if track.cover_image %}
                    <img src="{{ track.cover_image.url }}" class="w-full h-full object-cover">
                {% else %}
                    <div class="w-full h-full flex items-center justify-center text-gray-500 bg-gray-600">
                        <span>🎵</span>
                    </div>
                {% endif %}
                <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                    <button onclick="playTrack('{{ track.audio_file.url }}', '{{ track.title|escapejs }}', '{{ track.artist|escapejs }}', '{% if track.cover_image %}{{ track.cover_image.url }}{% endif %}', '{{ track.id }}', '{{ track.is_liked }}')" class="text-white">
                        ▶
                    </button>
                </div>
            </div>

            <!-- Info -->
            <div class="flex-1">
                <div class="font-bold">{{ track.title }}</div>
                <div class="text-sm text-gray-400">{{ track.artist }}</div>
            </div>

            <!-- Stats -->
            <div class="text-sm text-gray-500">
                Played {{ track.play_count }} times
            </div>

            <!-- Actions -->
            <button class="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition">
                ♥
            </button>
        </div>
        {% empty %}
        <div class="text-center text-gray-500 py-10">
            No history yet. Start listening!
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
