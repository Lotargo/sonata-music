{% extends 'music/base.html' %}

{% block content %}
<div class="p-8 max-w-2xl mx-auto">
    <div class="flex items-center gap-6 mb-10">
        <div class="w-24 h-24 bg-gray-600 rounded-full flex items-center justify-center text-4xl">U</div>
        <div>
            <h1 class="text-3xl font-bold">User Profile</h1>
            <p class="text-gray-400">Standard Plan</p>
        </div>
    </div>

    <div class="bg-yandex-lightgray rounded-xl p-6 space-y-6">
        <div>
            <h3 class="text-xl font-bold mb-4">Settings</h3>
            <div class="flex items-center justify-between py-3 border-b border-gray-700">
                <span>Dark Mode</span>
                <span class="text-yandex-yellow">On</span>
            </div>
            <div class="flex items-center justify-between py-3 border-b border-gray-700">
                <span>Audio Quality</span>
                <span class="text-gray-400">High (320kbps)</span>
            </div>
            <div class="flex items-center justify-between py-3">
                <span>Notifications</span>
                <span class="text-gray-400">Enabled</span>
            </div>
        </div>

        <div class="pt-4">
            <button class="w-full bg-red-600/20 text-red-500 py-3 rounded-lg hover:bg-red-600/30 transition">
                Log Out
            </button>
        </div>
    </div>
</div>
{% endblock %}
