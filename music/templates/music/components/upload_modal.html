<div id="upload-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4 bg-black/70 backdrop-blur-md transition-opacity duration-300">
    <div class="upload-dialog bg-[#151515] w-full max-w-2xl rounded-[10px] p-8 border border-white/10 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar relative">
        <div class="upload-dialog-head flex justify-between items-center mb-6 sticky top-0 bg-[#151515] z-10 pb-4 border-b border-white/5">
            <h2 id="upload-modal-title" class="text-2xl font-bold flex items-center gap-2">
                <i data-lucide="upload-cloud" class="text-[var(--yellow)]"></i> Загрузка аудио
            </h2>
            <button onclick="closeUploadModal()" class="text-slate-400 hover:text-white transition"><i data-lucide="x"></i></button>
        </div>

        <!-- Step 1: File Selection -->
        <div id="drop-zone" class="border-2 border-dashed border-slate-700 rounded-xl p-12 text-center hover:border-indigo-500 hover:bg-indigo-500/5 transition cursor-pointer mb-6 group">
            <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition">
                <i data-lucide="music" class="w-8 h-8 text-[var(--yellow)]"></i>
            </div>
            <p class="text-xl font-bold mb-2">Перетащите файл или выберите вручную</p>
            <p class="text-slate-400 text-sm">MP3, WAV, FLAC, OGG до 50MB</p>
            <input type="file" id="file-input" class="hidden" accept="audio/*">
        </div>

        <!-- Step 2: Configuration (Hidden initially) -->
            <div id="upload-config" class="hidden space-y-6">

            <!-- Track Info -->
            <div class="bg-slate-800/50 rounded-xl p-4 border border-white/5 space-y-4">
                 <div class="flex items-center gap-4">
                     <div class="w-16 h-16 bg-slate-700 rounded-lg overflow-hidden flex-shrink-0">
                         <img id="upload-cover-preview" src="" class="w-full h-full object-cover hidden">
                         <div id="upload-cover-placeholder" class="w-full h-full flex items-center justify-center text-slate-500">
                             <i data-lucide="music" class="w-6 h-6"></i>
                         </div>
                     </div>
                     <div class="flex-1 space-y-2">
                         <input type="text" id="input-title" class="w-full bg-transparent border-b border-slate-600 focus:border-indigo-500 text-lg font-bold placeholder-slate-500 focus:outline-none transition py-1" placeholder="Track Title">
                         <input type="text" id="input-artist" class="w-full bg-transparent border-b border-slate-600 focus:border-indigo-500 text-sm text-slate-300 placeholder-slate-500 focus:outline-none transition py-1" placeholder="Artist Name">
                     </div>
                 </div>

                 <!-- Acoustic Badges (BPM, Musical Key, Centroid, Duration) -->
                 <div id="acoustic-badges" class="hidden flex flex-wrap gap-2 pt-2 border-t border-white/5">
                     <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-indigo-500/15 border border-indigo-500/30 text-indigo-300 text-xs font-semibold" title="Определенный темп">
                         <i data-lucide="activity" class="w-3.5 h-3.5"></i>
                         <span id="badge-bpm">-- BPM</span>
                     </div>
                     <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs font-semibold" title="Музыкальная тональность">
                         <i data-lucide="music-2" class="w-3.5 h-3.5"></i>
                         <span id="badge-key">--</span>
                     </div>
                     <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs font-semibold" title="Спектральная яркость (центроид)">
                         <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                         <span id="badge-centroid">-- Hz</span>
                     </div>
                     <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-slate-700/50 border border-white/10 text-slate-300 text-xs font-semibold" title="Длительность">
                         <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                         <span id="badge-duration">--:--</span>
                     </div>
                 </div>
            </div>

            <div id="library-upload-options" class="hidden rounded-xl border border-white/5 bg-slate-800/40 p-4">
                <label class="flex items-start gap-3 cursor-pointer">
                    <input type="checkbox" id="library-enhance-quality" class="mt-1 rounded bg-slate-700 border-slate-600 text-[var(--yellow)] focus:ring-0">
                    <span>
                        <span class="block text-sm font-bold text-white">Улучшить качество</span>
                        <span class="block text-xs text-slate-400 mt-1">Применить базовую DSP-обработку с дефолтными настройками после добавления в библиотеку.</span>
                    </span>
                </label>
            </div>

            <!-- Mode Selector -->
            <div id="processing-mode-section">
                <label class="block text-sm font-medium text-slate-400 mb-2 uppercase tracking-wider text-xs">Режим обработки</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 bg-slate-800 rounded-lg p-1 border border-slate-700 gap-1">
                    <button id="mode-direct" onclick="setUploadMode('direct')" class="py-2.5 text-xs font-medium text-slate-400 hover:text-white transition flex flex-col items-center justify-center gap-1">
                        <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
                        <span>Конвертация</span>
                    </button>
                    <button id="mode-stealth" onclick="setUploadMode('stealth')" class="py-2.5 text-xs font-medium text-slate-400 hover:text-white transition flex flex-col items-center justify-center gap-1">
                        <i data-lucide="shield-check" class="w-4 h-4"></i>
                        <span>Anti-AI</span>
                    </button>
                    <button id="mode-ai" onclick="setUploadMode('ai')" class="py-2.5 text-xs font-bold rounded-md bg-indigo-600 text-white shadow-sm transition flex flex-col items-center justify-center gap-1">
                        <i data-lucide="sparkles" class="w-4 h-4"></i>
                        <span>AI-апскейл</span>
                    </button>
                    <button id="mode-hybrid" onclick="setUploadMode('hybrid')" class="py-2.5 text-xs font-medium text-slate-400 hover:text-white transition flex flex-col items-center justify-center gap-1">
                         <i data-lucide="split" class="w-4 h-4"></i>
                         <span>Hybrid</span>
                    </button>
                    <button id="mode-restoration" onclick="setUploadMode('restoration')" class="py-2.5 text-xs font-medium text-slate-400 hover:text-white transition flex flex-col items-center justify-center gap-1">
                         <i data-lucide="wand-sparkles" class="w-4 h-4"></i>
                         <span>Реставрация</span>
                    </button>
                    <button id="mode-dsp" onclick="setUploadMode('dsp')" class="py-2.5 text-xs font-medium text-slate-400 hover:text-white transition flex flex-col items-center justify-center gap-1">
                        <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                        <span>Studio DSP</span>
                    </button>
                </div>
                <input type="hidden" id="processing-mode" value="ai">
                <p id="mode-desc" class="text-xs text-slate-400 mt-3 bg-slate-800/50 p-3 rounded-lg border border-white/5">
                    <span class="text-[var(--yellow)] font-bold">AI-апскейл:</span> восстанавливает верхние частоты и мягко подготавливает трек DSP-цепочкой.
                </p>
            </div>

            <!-- AI Settings -->
            <div id="ai-settings" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Quality Preset</label>
                        <select id="quality-preset" onchange="updateQualityPreset()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                            <option value="fast">Fast (25 steps)</option>
                            <option value="balanced" selected>Balanced (50 steps)</option>
                            <option value="high">High (100 steps)</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Steps (DDIM)</label>
                        <input type="number" id="ddim-steps" value="50" disabled class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50 transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2 flex justify-between">
                        Guidance Scale (CFG)
                        <span id="guidance-value" class="text-indigo-400">3.5</span>
                    </label>
                    <input type="range" id="guidance-scale" min="1.0" max="10.0" step="0.1" value="3.5" disabled oninput="document.getElementById('guidance-value').innerText = this.value" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500 disabled:opacity-50">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Seed</label>
                        <input type="number" id="ai-seed" value="42" min="0" max="2147483647" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Batch Size</label>
                        <input type="number" id="ai-batch-size" value="2" min="1" max="8" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    </div>
                </div>
            </div>

            <!-- DSP Settings -->
            <div id="dsp-settings" class="space-y-4">
                <div class="flex justify-between items-center">
                    <label id="dsp-label" class="block text-xs font-bold text-slate-500 uppercase">DSP-подготовка</label>
                    <button onclick="toggleDspAdvanced()" class="text-xs text-indigo-400 hover:text-indigo-300 font-bold flex items-center gap-1 transition">
                        Тонкие настройки <i data-lucide="chevron-down" class="w-3 h-3"></i>
                    </button>
                </div>
                <select id="dsp-preset" onchange="updateDspPreset()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    <option value="mastering" selected>Mastering (Balanced)</option>
                    <option value="deep_bass">Deep Bass (Sub Focus)</option>
                    <option value="clear">Clear (Vocal Focus)</option>
                    <option value="warm">Warm (Vintage/Tube)</option>
                    <option value="punchy">Punchy (Drums/Bass)</option>
                </select>

                <div id="dsp-advanced" class="hidden space-y-4 p-4 bg-slate-800/50 rounded-lg border border-white/5 animate-in fade-in slide-in-from-top-2 duration-300">
                    <!-- Stereo -->
                    <div>
                         <div class="flex justify-between mb-1">
                            <label class="text-xs font-medium text-slate-400">Stereo Width</label>
                            <span id="val-stereo" class="text-xs font-mono text-slate-500">100%</span>
                         </div>
                         <input type="range" id="stereo-width" min="0" max="200" step="5" value="100" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    </div>

                    <!-- EQ -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                             <div class="flex justify-between mb-1">
                                <label class="text-xs font-medium text-slate-400">Bass Boost</label>
                                <span id="val-bass" class="text-xs font-mono text-slate-500">0dB</span>
                             </div>
                             <input type="range" id="bass-boost" min="-10" max="10" step="0.5" value="0" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                        </div>
                        <div>
                             <div class="flex justify-between mb-1">
                                <label class="text-xs font-medium text-slate-400">Voice Clarity</label>
                                <span id="val-clarity" class="text-xs font-mono text-slate-500">0</span>
                             </div>
                             <input type="range" id="voice-clarity" min="-5" max="10" step="0.5" value="0" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                        </div>
                    </div>

                    <!-- Compressor -->
                    <div>
                         <div class="flex justify-between mb-1">
                            <label class="text-xs font-medium text-slate-400">Compressor Amount</label>
                            <span id="val-comp" class="text-xs font-mono text-slate-500">50%</span>
                         </div>
                         <input type="range" id="compressor-amount" min="0" max="100" step="5" value="50" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    </div>

                    <!-- Reverb -->
                    <div class="border-t border-white/10 pt-3">
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-xs font-medium text-slate-400 flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" id="reverb-enabled" class="rounded bg-slate-700 border-slate-600 text-indigo-500 focus:ring-0">
                                Add Reverb
                            </label>
                        </div>
                        <div id="reverb-controls" class="grid grid-cols-2 gap-4 opacity-50 pointer-events-none transition">
                            <div>
                                 <div class="flex justify-between mb-1">
                                    <label class="text-[10px] font-medium text-slate-500">Size</label>
                                    <span id="val-rev-size" class="text-[10px] font-mono text-slate-600">50%</span>
                                 </div>
                                 <input type="range" id="reverb-size" min="0" max="100" step="5" value="50" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                            </div>
                            <div>
                                 <div class="flex justify-between mb-1">
                                    <label class="text-[10px] font-medium text-slate-500">Mix</label>
                                    <span id="val-rev-mix" class="text-[10px] font-mono text-slate-600">30%</span>
                                 </div>
                                 <input type="range" id="reverb-amount" min="0" max="100" step="5" value="30" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Format Settings -->
            <div id="format-settings" class="grid grid-cols-3 gap-4 border-t border-white/5 pt-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Format</label>
                    <select id="target-format" onchange="updateBitrateOptions()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="wav">WAV</option>
                        <option value="mp3" selected>MP3</option>
                        <option value="m4a">M4A (AAC)</option>
                        <option value="flac">FLAC</option>
                        <option value="ogg">OGG</option>
                        <option value="opus">Opus</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Sample Rate</label>
                    <select id="target-sr" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="44100">44.1 kHz</option>
                        <option value="48000" selected>48 kHz</option>
                        <option value="96000">96 kHz</option>
                    </select>
                </div>
                <div id="bitrate-container">
                    <label id="bitrate-label" class="block text-xs font-bold text-slate-500 uppercase mb-2">Bitrate</label>
                    <select id="target-bitrate" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <!-- Populated by JS -->
                    </select>
                </div>
            </div>
        </div>

        <!-- Footer / Action -->
        <div class="mt-8">
            <button id="start-process-btn" onclick="startProcessing()" disabled class="w-full bg-indigo-600 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-indigo-700 text-white py-3.5 rounded-xl font-bold transition shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2">
                Запустить обработку
            </button>
        </div>
    </div>
</div>
