<div id="delete-confirm-modal" class="delete-confirm-modal hidden" role="dialog" aria-modal="true" aria-labelledby="delete-confirm-title" onclick="handleDeleteConfirmBackdrop(event)">
    <div class="delete-confirm-dialog" role="document">
        <button type="button" class="delete-confirm-close" onclick="closeDeleteConfirmation()" aria-label="Закрыть подтверждение удаления">
            <i data-lucide="x"></i>
        </button>

        <div class="delete-confirm-head">
            <span class="delete-confirm-icon" aria-hidden="true"><i data-lucide="trash-2"></i></span>
            <h2 id="delete-confirm-title">Удалить трек?</h2>
        </div>

        <p class="delete-confirm-message">
            <strong id="delete-confirm-track-name">Без названия</strong> будет удалён из медиатеки вместе со всеми файлами.
        </p>
        <p class="delete-confirm-warning">Это действие нельзя отменить.</p>
        <p id="delete-confirm-error" class="delete-confirm-error hidden" role="alert"></p>

        <div class="delete-confirm-actions">
            <button type="button" id="delete-confirm-cancel" class="delete-confirm-cancel" onclick="closeDeleteConfirmation()">Отмена</button>
            <button type="button" id="delete-confirm-submit" class="delete-confirm-submit" onclick="confirmTrackDeletion()">
                <i data-lucide="trash-2"></i>
                <span>Удалить</span>
            </button>
        </div>
    </div>
</div>
